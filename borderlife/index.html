/* ---------- 遊戲建立 ---------- */
function newGame(seedIn) {
  const seed = String(seedIn == null ? '0' : seedIn).trim() || '0';
  const G = {
    seed, r: mulberry(hashSeed(seed)), choices: [], feed: [], node: null, pending: null, ended: false,
    t: 0, chNo: 0, bi: -1, name: 'Lu',
    stats: { pro: 6, body: 6, pol: 4, fam: 6, rep: 3 },
    aff: 12, trust: 28, rel: 0, lastContact: 0, hidden: false,
    mitch: { bond: 10, status: 'ok' },
    married: false, ruzhui: null, surname: null, children: [], injuries: [], debt: 0, merit: 0, rank: 1, track: null,
    tier: 'civil', loadout: PRESETS.B.mods.slice(), ammo: { gren: 0, frag: 0, smoke: 0 }, used: { gren: 0, frag: 0, smoke: 0 },
    carry: [], prepBank: 0, syn: 0, intel: {}, exam: null, team: [], cands: [], rivals: [], allies: [],
    deltas: [], tags: {}, life: [], dayCount: 0, lastDaily: [], pp: null, sumDone: {}, enemies: [], op: null, nextFn: null
  };
  G.int = (a, b) => a + Math.floor(G.r() * (b - a + 1));
  G.pick = a => a[Math.floor(G.r() * a.length)];
  G.shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(G.r() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; } return a; };
  // 五維：總和25
  const keys = ['pro', 'body', 'pol', 'fam', 'rep'];
  for (let i = 0; i < 4; i++) {
    const from = G.pick(keys.filter(k => G.stats[k] > 2));
    const to = G.pick(keys.filter(k => G.stats[k] < 8 && k !== from));
    G.stats[from]--; G.stats[to]++;
  }
  genFamily(G);
  genCands(G);
  // 父母壽數、妹妹
  G.fatherEnd = G.int(40, 60); G.motherEnd = G.int(46, 66);
  G.lifeSpan = 0;
  return G;
}

function genFamily(G) {
  const nm = G.shuffle(N_BORDER_M), nf = G.shuffle(N_BORDER_F);
  G.family = {
    father: { name: nm[0], job: G.pick(['廢鐵回收工', '搬運班組長', '礦場爆破學徒轉任看守', '配給站倉管']), trait: G.pick(['沉默寡言', '固執但護短', '愛面子', '手很巧']), alive: true },
    mother: { name: nf[0], job: G.pick(['替人縫補與洗衣', '地下診所助手', '配給站炊事', '修理民用骨骼的焊工']), trait: G.pick(['精打細算', '嘴硬心軟', '很會唱歌', '消息靈通']), alive: true },
    sister: { name: nf[1], trait: G.pick(['黏人愛撒嬌', '倔強不服輸', '愛畫畫', '膽子大得離譜']), quirk: G.pick(['收集彈殼當玩具', '把配給糖留給哥哥', '用粉筆在牆上畫外骨骼', '半夜會夢遊找哥哥']) }
  };
}

function genCands(G) {
  const roles = G.shuffle(ROLES);
  const ov = G.shuffle(['border', 'border', 'border', 'common', 'common', 'common', 'noble', 'noble']);
  const used = new Set();
  G.cands = ov.map((o, i) => {
    let name;
    if (o === 'border') { const pool = G.r() < 0.5 ? N_BORDER_M : N_BORDER_F; name = G.pick(pool.filter(x => !used.has(x))); }
    else if (o === 'common') { name = G.pick(N_COMMON_G.filter(x => !used.has(x))) + '·' + G.pick(N_COMMON_S); }
    else { name = G.pick(N_NOBLE_G.filter(x => !used.has(x))) + '·' + G.pick(N_NOBLE_S); }
    used.add(name.split('·')[0]);
    const role = roles[i % roles.length], trait = G.pick(TRAITS);
    const tier = o === 'noble' ? (G.r() < 0.45 ? 'family' : 'standard') : o === 'common' ? (G.r() < 0.6 ? 'standard' : 'civil') : 'civil';
    const rating = clamp(G.int(4, 7) + (o === 'noble' ? 1 : 0) + (tier === 'family' ? 1 : 0), 4, 9);
    const diff = clamp(6 + trait.res + (o === 'noble' ? 3 : o === 'common' ? 1 : 0) + (rating >= 7 ? 1 : 0), 5, 13);
    return {
      id: i, name, origin: o, role: role.r, tier, trait: trait.n, syn: trait.syn, rating, diff,
      str: G.pick(role.s), weak: G.pick(role.w)
    };
  });
}

/* ---------- 時間與狀態 ---------- */
function when(G) { const i = tInfo(G.t); return `${i.year}·${i.season}·${i.age}歲`; }
function age(G) { return tInfo(G.t).age; }

function overall(G) { return totalStat(G) * 2; }
function rankName(G) { return RANKS[G.rank]; }
function displayName(G) { return G.ruzhui ? 'Lu·凡爾瑟' : 'Lu'; }
function logLife(G, text) { G.life.push({ age: age(G), year: tInfo(G.t).year, text }); }

function setTime(G, t) {
  const o = tInfo(G.t), n = tInfo(t);
  G.t = t;
  for (const th of [40, 50, 60, 70]) {
    if (o.age < th && n.age >= th) { G.stats.body = clamp(G.stats.body - 1, 1, 10); G.deltas.push({ label: '體魄', d: -1, reason: `年過${th}，筋骨不復當年` }); }
  }
  if (G.family) {
    if (G.family.father.alive && n.age >= G.fatherEnd) { G.family.father.alive = false; G.deltas.push({ label: '家庭和睦', d: -1, reason: `父親${G.family.father.name}過世` }); G.stats.fam = clamp(G.stats.fam - 1, 1, 10); logLife(G, `父親${G.family.father.name}過世。`); }
    if (G.family.mother.alive && n.age >= G.motherEnd) { G.family.mother.alive = false; G.deltas.push({ label: '家庭和睦', d: -1, reason: `母親${G.family.mother.name}過世` }); G.stats.fam = clamp(G.stats.fam - 1, 1, 10); logLife(G, `母親${G.family.mother.name}過世。`); }
  }
}

/* ---------- 效果套用 ---------- */
function bumpRel(v, d) {
  if (d > 0) { const m = 1 - v / 150; return Math.max(1, Math.round(d * m + 0.3)); }
  const m = 1 + v / 200; return -Math.max(1, Math.round(-d * m));
}
function applyFx(G, fx, ctx) {
  if (!fx) return;
  for (const k of ['pro', 'body', 'pol', 'fam', 'rep']) {
    if (fx[k]) {
      const nv = clamp(G.stats[k] + fx[k], 1, 10), d = nv - G.stats[k];
      G.stats[k] = nv;
      if (d) G.deltas.push({ label: ATTR_N[k], d, reason: (fx.why && fx.why[k]) || ctx || '' });
    }
  }
  if (fx.aff) {
    const d = bumpRel(G.aff, fx.aff), nv = clamp(G.aff + d, 0, 100); const dd = nv - G.aff; G.aff = nv; G.lastContact = G.t;
    if (dd) G.deltas.push({ label: '好感', d: dd, reason: (fx.why && fx.why.aff) || ctx || '' });
  }
  if (fx.trust) {
    const d = bumpRel(G.trust, fx.trust), nv = clamp(G.trust + d, 0, 100); const dd = nv - G.trust; G.trust = nv; G.lastContact = G.t;
    if (dd) G.deltas.push({ label: '信任', d: dd, reason: (fx.why && fx.why.trust) || ctx || '' });
  }
  if (fx.mitch) {
    const d = bumpRel(G.mitch.bond, fx.mitch), nv = clamp(G.mitch.bond + d, 0, 100); const dd = nv - G.mitch.bond; G.mitch.bond = nv;
    if (dd) G.deltas.push({ label: '米切爾羈絆', d: dd, reason: (fx.why && fx.why.mitch) || ctx || '' });
  }
  if (fx.merit) { fx.merit = Math.max(-G.merit, fx.merit); G.merit += fx.merit; G.deltas.push({ label: '戰功', d: fx.merit, reason: ctx || '' }); }
  if (fx.debt) { G.debt = Math.max(0, G.debt + fx.debt); G.deltas.push({ label: '人情債', d: fx.debt, reason: (fx.why && fx.why.debt) || ctx || '' }); }
  if (fx.syn) G.syn = clamp(G.syn + fx.syn, -2, 2);
  if (fx.prep) G.prepBank = clamp(G.prepBank + fx.prep, 0, 2);
  if (fx.tier && TIER_B[fx.tier] > TIER_B[G.tier]) { G.tier = fx.tier; G.deltas.push({ label: '模組等級', d: 0, reason: '取得' + TIER_N[fx.tier], text: '升級為' + TIER_N[fx.tier] }); }
  if (fx.intel) Object.assign(G.intel, fx.intel);
  if (fx.tags) Object.assign(G.tags, fx.tags);
  if (fx.carry) for (const c of fx.carry) G.carry.push(Object.assign({ left: 1 }, c));
  if (fx.noise && G.exam) G.exam.noise = clamp(G.exam.noise + fx.noise, 0, 10);
  if (fx.inj) addInjury(G, fx.inj === true ? null : fx.inj);
  if (fx.log) logLife(G, fx.log);
  if (fx.hook) fx.hook(G);
}
function addInjury(G, spec) {
  const pool = INJURIES.filter(i => !G.injuries.some(x => x.name === i.name));
  const inj = spec && spec.name ? spec : (pool.length ? G.pick(pool) : INJURIES[0]);
  const rec = { name: inj.name, desc: inj.desc, pen: inj.pen, cats: inj.cats, age: age(G), year: tInfo(G.t).year };
  if (G.injuries.some(x => x.name === rec.name)) { rec.pen = 1; rec.name += '（復發加重）'; }
  G.injuries.push(rec);
  G.deltas.push({ label: '傷病檔案', d: 0, reason: '', text: `新增：${rec.name}（${rec.desc}）` });
  logLife(G, `留下永久傷病：${rec.name}。`);
  if (G.rel >= 3 && !G.married) G.tags.newInj = true; else if (G.rel >= 5) G.tags.newInj = true;
}

/* ---------- 裝備 ---------- */
function slotsUsed(mods) { return mods.reduce((s, m) => s + MODS[m].s, 0); }
function ammoFor(mods, preset) {
  const gren = mods.includes('ugl') ? (mods.includes('breach') ? 8 : 6) : 0;
  return { gren, frag: mods.includes('frag') ? 3 : 0, smoke: mods.includes('smoke') ? 2 : 0 };
}
function setLoadout(G, mods, fresh) {
  G.loadout = mods.slice();
  const base = ammoFor(mods);
  if (fresh) { G.used = { gren: 0, frag: 0, smoke: 0 }; }
  G.ammo = { gren: Math.max(0, base.gren - G.used.gren), frag: Math.max(0, base.frag - G.used.frag), smoke: Math.max(0, base.smoke - G.used.smoke) };
}
function consume(G, a) {
  if (!a) return;
  for (const k of ['gren', 'frag', 'smoke']) if (a[k]) { const n = Math.min(G.ammo[k], a[k]); G.ammo[k] -= n; G.used[k] += n; }
}
function presetOf(mods) {
  for (const k in PRESETS) { const p = PRESETS[k].mods; if (p.length === mods.length && p.every(m => mods.includes(m))) return PRESETS[k]; }
  return null;
}
function loadoutName(mods) { const p = presetOf(mods); return p ? `配置${p.id}「${p.name}」` : '自訂配置'; }
function equipMod(G, cat, ammo) {
  if (!COMBAT.has(cat)) return { v: 0, parts: [['非戰鬥行動，不計裝備', 0]] };
  const parts = []; let sum = TIER_B[G.tier];
  parts.push([`${TIER_N[G.tier]}（機架統一，差在模組等級）`, TIER_B[G.tier]]);
  for (const m of G.loadout) {
    const d = MODS[m], b = d.b[cat];
    if (!b) continue;
    if (d.ammo && ammo && ammo[d.ammo] <= 0) { parts.push([d.n + '（耗材用盡，失效）', 0]); continue; }
    parts.push([d.n, b]); sum += b;
  }
  const v = clamp(sum, -2, 2);
  if (v !== sum) parts.push(['達到修正上限', v - sum]);
  return { v, parts };
}

/* ---------- 隊伍 ---------- */
function teamAlive(G) { return G.team.filter(m => m.alive); }
function teamMod(G) {
  const al = teamAlive(G), n = al.length + 1;
  const parts = [];
  const sm = { 1: -2, 2: 0, 3: 1, 4: 1 }[n] || 1;
  parts.push([n === 1 ? '孤狼：火力與視野薄弱' : `${n}人編隊的分工彈性`, sm]);
  let v = sm;
  if (n > 1) {
    const syn = clamp(G.syn + al.reduce((s, m) => s + m.syn, 0), -2, 2);
    if (syn) { parts.push(['隊內默契／磨合', syn]); v += syn; }
    const avg = al.reduce((s, m) => s + m.rating, 0) / al.length;
    if (avg >= 7) { parts.push(['隊友整體實力強', 1]); v += 1; } else if (avg <= 4.5) { parts.push(['隊友整體實力偏弱', -1]); v -= 1; }
  }
  return { v, parts };
}

/* ---------- 判定 ---------- */
function attrValue(G, a) {
  const s = G.stats;
  switch (a) {
    case 'proBody': return [Math.max(s.pro, s.body), s.pro >= s.body ? '專業' : '體魄'];
    case 'polRep': return [Math.max(s.pol, s.rep), s.pol >= s.rep ? '權謀' : '聲望'];
    case 'proPol': return [Math.max(s.pro, s.pol), s.pro >= s.pol ? '專業' : '權謀'];
    default: return [s[a], ATTR_N[a]];
  }
}
function veroMod(G) {
  if (G.rel < 3) return null;
  if (G.aff >= 70 && G.trust >= 60) return [`與薇若妮卡好感${G.aff}／信任${G.trust}，默契十足`, 1];
  if (G.aff < 30 || G.trust < 30) return [`與薇若妮卡好感${G.aff}／信任${G.trust}，猜忌與心結`, -1];
  return null;
}
function evalOpt(G, o) {
  const [av, an] = attrValue(G, o.attr);
  const eq = o.equip ? { v: o.equip[0], parts: [[o.equip[1], o.equip[0]]] } : equipMod(G, o.cat, G.ammo);
  const sit = [];
  for (const s of (o.situ || [])) sit.push(s);
  const combat = COMBAT.has(o.cat);
  if (o.team) { const tm = teamMod(G); for (const p of tm.parts) if (p[1]) sit.push(p); }
  let inj = 0; const injN = [];
  for (const i of G.injuries) if (i.cats.includes('all') || i.cats.includes(o.cat)) { inj += i.pen; injN.push(i.name); }
  if (inj) sit.push([`傷病影響（${injN.join('、')}）`, -Math.min(3, inj)]);
  if (G.stats.fam <= 3 && combat) sit.push(['牽掛家人，心神不寧', -1]);
  if (G.stats.fam >= 8) sit.push(['家人的支持，心裡踏實', 1]);
  if (o.cat === 'politics' && G.debt > 0) sit.push([`欠下人情債×${G.debt}，被對方牽制`, -1]);
  if (o.vero) { const v = veroMod(G); if (v) sit.push(v); }
  if (o.mitch && G.mitch.bond >= 55 && G.mitch.status === 'ok') sit.push([`米切爾羈絆${G.mitch.bond}，他會在你背後`, 1]);
  const carried = [];
  for (const c of G.carry) if (!c.cats || c.cats.includes(o.cat) || (c.cats.includes('combat') && combat)) { sit.push([c.why, c.v]); carried.push(c); }
  let sitSum = sit.reduce((s, x) => s + x[1], 0);
  const sitV = clamp(sitSum, -3, 3);
  if (sitV !== sitSum) sit.push(['情境修正達到上限', sitV - sitSum]);
  const prep = clamp((o.prep || 0) + G.prepBank, 0, 2);
  const prepWhy = [];
  if (o.prep) prepWhy.push([o.prepWhy || '事前準備', o.prep]);
  if (G.prepBank) prepWhy.push(['先前的偵察、演練與計畫', G.prepBank]);
  const eff = av + eq.v + sitV + prep + EASE;
  const gap = eff - o.diff;
  let key, minor = false, close = false;
  if (gap >= 4) key = 'great';
  else if (gap >= 0) { key = 'success'; minor = gap <= 1; }
  else if (gap <= -6) key = 'bigfail';
  else { key = 'fail'; close = gap >= -2; }
  return { attrName: an, attrVal: av, equip: eq, situ: sit, situV: sitV, prep, prepWhy, ease: EASE, eff, diff: o.diff, why: o.why || '', gap, key, minor, close, carried };
}
const RES_N = { great: '大成功', success: '成功', fail: '失敗', bigfail: '大失敗' };
function resLabel(ev) {
  if (ev.key === 'success' && ev.minor) return '成功（附輕微代價）';
  if (ev.key === 'fail' && ev.close) return '失敗（可承擔代價轉為悲壯成功）';
  return RES_N[ev.key];
}

function sanitizeMods(G, mods) {
  const out = [];
  for (const m of mods) if (MODS[m] && !out.includes(m)) out.push(m);
  if (!out.includes('rifle')) out.unshift('rifle');
  while (slotsUsed(out) > SLOT_CAP[G.tier]) { for (let i = out.length - 1; i >= 0; i--) if (out[i] !== 'rifle') { out.splice(i, 1); break; } }
  return out;
}

function beatTarget(G, b) {
  if (b.t != null) return b.t;
  const a = b.ageFn ? b.ageFn(G) : b.age;
  return ageToT(a, b.s || 0);
}

function insertBeats(G, list) {
  for (const nb of list) {
    const tn = beatTarget(G, nb);
    let i = G.bi + 1;
    while (i < G.beats.length && beatTarget(G, G.beats[i]) <= tn) i++;
    G.beats.splice(i, 0, nb);
  }
}

function teamPick(G, sel) {
  const ids = sel === 'solo' ? [] : String(sel).split(',').filter(Boolean).map(Number).slice(0, 3);
  G.nextFn = null;
  if (!ids.length) {
    pickBlock(G, '孤狼出戰', '一個人，一副民用承重架，自己扛');
    say(G, '你把識別牌別在胸前，沒有走向任何一張桌子。米切爾遠遠看了你一眼，張了張嘴，又把話吞了回去。');
  } else {
    pickBlock(G, '發出邀請', ids.map(i => G.cands[i].name).join('、'));
    for (const i of ids) {
      const c = G.cands[i], spec = inviteSpec(G, c), ev = evalOpt(G, spec);
      G.feed.push({ k: 'judge', name: spec.name, ev, label: resLabel(ev) });
      if (ev.key === 'great' || ev.key === 'success') {
        G.team.push(Object.assign({ alive: true }, c));
        const nobleLine = c.origin === 'noble' ? '雖然一開始皺了眉，但你開出的條件讓他無法拒絕。' : '';
        say(G, `${c.name}點了頭。${nobleLine}（${c.role}，${c.str}；缺點：${c.weak}）`);
        if (ev.key === 'great') { G.syn = clamp(G.syn + 1, -2, 2); say(G, '這次邀請幾乎沒費力氣，雙方一拍即合。'); }
      } else {
        say(G, `${c.name}搖了搖頭。${c.origin === 'noble' ? '「我的隊伍不收來路不明的人。」' : c.trait === '高傲' ? '「我自己一個人就夠了。」' : '「抱歉，我已經有別的打算。」'}`);
      }
    }
    if (!G.team.length) say(G, '三個人全拒絕了你。你收起識別牌，只能孤身出戰。');
  }
  G.rivals = G.cands.filter(c => !G.team.some(m => m.id === c.id));
  makeEnemies(G);
  flush(G);
  bondNode(G);
}

function makeEnemies(G) {
  const pool = G.rivals.slice();
  const nobles = pool.filter(c => c.origin === 'noble'), others = G.shuffle(pool.filter(c => c.origin !== 'noble'));
  const groups = [];
  if (nobles.length) groups.push(nobles);
  let cur = [];
  for (const c of others) { cur.push(c); if (cur.length >= 3) { groups.push(cur); cur = []; } }
  if (cur.length) groups.push(cur);
  if (groups.length < 2 && groups[0] && groups[0].length >= 2) { const g = groups.pop(); groups.push(g.slice(0, 1)); groups.push(g.slice(1)); }
  G.enemies = groups.map(g => {
    const avg = g.reduce((s, c) => s + c.rating, 0) / g.length;
    const fam = g.some(c => c.tier === 'family');
    return { name: g[0].name.split('·')[0] + '隊', leader: g[0], members: g, size: g.length, alive: true, rating: avg, fam, diff: clamp(Math.round(avg) + 2 + (g.length >= 3 ? 1 : 0) + (fam ? 1 : 0), 6, 12) };
  });
}

}

function landingAfter(G, res, zone) {
  const E = G.exam;
  if (zone === 'tower') E.near = true;
  if (zone === 'edge') E.far = true;
  if (res.key === 'great') { G.carry.push({ why: '落點占優，先手位置', v: 1, cats: ['combat'], left: 2 }); }
  if (res.key === 'bigfail') { consume(G, { gren: G.ammo.gren, smoke: 1 }); say(G, '空投倉的彈藥匣碎了一地，榴彈只剩零星幾枚。'); }
  if (!res.succ && res.key === 'fail') consume(G, { smoke: 1 });
  if (G.team.length && zone !== 'ally' && G.syn + teamAlive(G).reduce((s, m) => s + m.syn, 0) < 1) {
    G.carry.push({ why: '落點分散，隊友集結延誤', v: -1, cats: ['combat'], left: 1 });
    say(G, '同隊的落點散得太開，集結耗了不少時間，隊形一開始就不齊。');
  }
}

/* ---------- 戰場態勢 ---------- */
function battleBlock(G) {
  const E = G.exam;
  G.feed.push({
    k: 'battle', data: {
      team: [{ n: displayName(G) + '（你）', a: !E.out }, ...G.team.map(m => ({ n: m.name, a: m.alive }))],
      noise: E.noise, noiseKnown: !!G.intel.rules, tower: E.tower, holdMin: E.holdMin,
      enemies: G.enemies.map(e => ({ n: e.name, s: e.size, a: e.alive, d: e.diff })),
      seniors: E.seniors.pressure ? '施壓中（目標：領先者與佔塔者）' : '已被牽制', drones: E.drones, droneKnown: !!G.intel.routes, droneZone: ZONES[E.droneZone].n,
      score: E.score, zone: E.zone ? ZONES[E.zone].n : '-'
    }
  });
}

function examLose(G) {
  const E = G.exam, al = teamAlive(G);
  if (al.length) {
    al.sort((a, b) => a.rating - b.rating);
    const m = al[0]; m.alive = false;
    say(G, `${m.name}的背心亮起紅燈，被判定淘汰。他退到場邊時回頭看了你一眼，沒說話。`);
    return 'mate';
  }
  E.out = true;
  say(G, '胸腔的衝擊感測背心發出長鳴，你被判定淘汰。你的考核在這一刻結束了。');
  return 'out';
}
function examFail(G, res, retreat) {
  const E = G.exam;
  if (res.key === 'bigfail') { E.out = true; say(G, '一連串命中把你整個人撞出了掩體，胸腔感測器長鳴，你被判定淘汰。'); return; }
  if (res.ev.close) { G.carry.push({ why: '被迫撤退，失去主動', v: -1, cats: ['combat'], left: 1 }); say(G, retreat); return; }
  examLose(G);
}

function droneCheck(G) {
  const E = G.exam;
  if (E.noise < 6 || E.drones <= 0 || E.out) return;
  say(G, `頭頂傳來螺旋槳的低鳴。噪音已累積到${E.noise}，一架軍用無人機沿著巡邏線轉了過來，掛載的模擬彈對準了聲源。`);
  const spec = { name: '無人機介入', attr: 'pro', cat: 'survive', diff: 8, why: '無人機的模擬彈雨，對所有人一視同仁', situ: G.intel.dronePlan ? [['演練過與無人機周旋', 1]] : [], team: false };
  const ev = evalOpt(G, spec);
  G.feed.push({ k: 'judge', name: spec.name, ev, label: resLabel(ev) });
  if (ev.key === 'great' || ev.key === 'success') {
    E.drones--; if (ev.key === 'great') E.score.impression++;
    say(G, '你利用掩體與煙塵拖住了它的鎖定，最後一發點射打壞了旋翼。它歪歪斜斜地墜進了廢料堆。');
  } else if (ev.key === 'bigfail') {
    E.out = true; say(G, '鎖定音響起時你還在移動。一整串模擬彈落下，你被判定淘汰。');
  } else {
    G.carry.push({ why: '被無人機壓制，傷了節奏', v: -1, cats: ['combat'], left: 1 }); consume(G, { smoke: 1 });
    say(G, '你狼狽地滾進掩體，煙幕彈用掉了一枚才擺脫鎖定。');
  }
  E.noise = 3;
}

function examNext(G) {
  const E = G.exam;
  flush(G);
  droneCheck(G);
  flush(G);
  if (E.out) return examFinish(G);
  const ph = E.phase++;
  if (ph === 0) return contestNode(G);
  if (ph === 1) return seniorsNode(G);
  if (ph === 2) return captureNode(G);
  if (ph === 3) return holdNode(G);
  return examFinish(G);
}

function enemyFor(G) {
  const alive = G.enemies.filter(e => e.alive).sort((a, b) => a.diff - b.diff);
  if (!alive.length) return null;
  const z = G.exam.zone;
  return z === 'tower' ? alive[alive.length - 1] : z === 'edge' ? alive[0] : alive[Math.floor(alive.length / 2)];
}
function styleCount(G, k) { G.exam.styles[k] = (G.exam.styles[k] || 0) + 1; }

function genChildren(G) {
  if (G.children.length) return;
  const girls = G.shuffle(['艾蓮娜', '凱特', '露西亞', '莉亞', '米婭', '瑟蕾']), boys = G.shuffle(['亞瑟', '卡斯', '雷恩', '伊森', '諾亞', '奧斯卡']);

  const mk = (given, girl, birth) => ({ given, girl, birth, ft: G.pick(FT), mt: G.pick(MT), ut: G.pick(UT), pass: null, path: null });
  G.children.push(mk(girls[0], true, 27));
  if (n === 2) { const girl = G.r() < 0.5; G.children.push(mk(girl ? girls[1] : boys[0], girl, 30)); }

  text: G => `冬天，旅部的電令在風雪裡抵達：左翼的第七哨所被叛軍切斷，建議放棄，部隊撤至二線。${hasM(G) ? '第七哨所裡有米切爾的機槍組。' : '第七哨所裡有你帶過的三個老兵。'}電令末端的簽名是參謀次長。你把那張紙翻了兩遍。無線電裡傳出的聲音斷斷續續，只能聽清一個詞：「……救……」`,

  text: G => `冬天，你在作戰參謀部熬了第三個通宵，核對下週的「冬季攻勢」計畫。補給線的時間表與前線的推進速度差了整整兩天：照這個計畫走，第三旅會在沒有補給的情況下孤軍深入。簽發計畫的是${AUG}的叔父，維爾哈特派的參謀次長。${hasM(G) ? '米切爾的機槍組就在第三旅。' : ''}`,

    O('trick', '重排修改版，經薇若妮卡之手遞上去', '熬夜重排一份補給表，以公爵家顧問的名義送進軍部', 'pol', 'politics', 9, '借力，需要她肯扛', [`你熬夜重排了一份補給時間表，格式、用詞與筆跡都對得上，請${V}以公爵家顧問的名義遞給軍部。三天後計畫修改，沒有人知道出自誰手。她在電話裡只說：「這次我替你扛。」你愣了很久。`, { aff: 3, trust: 2, debt: 1 }], [`修改版被次長識破是「繞過程序」，${V}替你擋下了質詢，代價是公爵家的一次人情。她沒有罵你，只是三天沒回信。`, { trust: -2, aff: -2, debt: 1 }], { vero: true, need: needV }),
  ]

  ]
};

function endingOf(G) {
  const t = G.tags;

  if (t.moleEnd === 'shadow') id = 'shadow';
  else if (t.moleEnd === 'confess') id = t.confessOk ? 'confess_ok' : 'confess_fail';
  else if (t.moleEnd === 'exit') id = 'exit';
  else if (t.scarred) id = 'scarred';
  else {
    const tr = G.track === 'staff' ? 'staff' : G.track === 'industry' ? 'ind' : 'front';
    if (tr === 'ind' && t.openTech) id = 'ind_open';
    else id = tr + '_' + (G.ruzhui ? 'duke' : G.married ? 'free' : 'alone');

  if (t.reconciled) L.push(`那場爭吵之後，你和${V}再也沒有讓同一件事，吵第二次。`);

function startGame(seed, script) {
  const sid = SCRIPTS[script] ? script : 's1';
  const G = newGame(seed);
  G.script = sid; G.beats = SCRIPTS[sid].beats();
  goNext(G); return G;
}
function validFree(G, sel) {
  const n = G.node; if (!n || !n.free) return false;
  for (const g of n.free.groups) {
    const v = sel[g.id]; if (v == null) continue;
    const ch = g.choices.find(c => c.id === v);
    if (!ch || ch.disabled) return false;
    if (ch.custom && !(Array.isArray(sel.custom))) return false;
  }
  return true;
}
function choose(G, c) {
  const n = G.node;
  if (!n || n.kind === 'end') return false;
  try {
    if (n.kind === 'team') {
      if (!/^t:/.test(c)) return false;
      G.node = null; teamPick(G, c.slice(2));
    } else if (n.kind === 'plans') {
      let o;
      if (c[0] === 'f') {
        const sel = JSON.parse(c.slice(2));
        if (!validFree(G, sel)) return false;
        o = n.free.build(G, sel);
        if (o.need) { const r = o.need(G); if (r) return false; }
      } else {
        const opt = n.opts[+c.slice(2)];
        if (!opt || opt.disabled) return false;
        o = opt.o;
      }
      G.node = null; runOption(G, o, n);
    } else if (n.kind === 'tragic') {
      G.node = null; tragicChoose(G, c === 'y');
    } else if (n.kind === 'pick') {
      const idx = +c.slice(2); const o = n.opts[idx];
      if (!o || o.disabled) return false;
      G.node = null; pickChoose(G, idx, n);
    } else return false;
  } catch (e) { e.message = '[choose ' + c + '] ' + e.message; throw e; }
  G.choices.push(c);
  return true;
}
function replay(seed, script, choices) {
  const G = startGame(seed, script);
  for (const c of choices) { if (!choose(G, c)) break; }
  return G;
}
const BL = { startGame, choose, replay, previewFree, evalOpt, newGame, when, age, totalStat, overall, rankName, displayName, tInfo, equipMod, teamMod, slotsUsed, loadoutName, presetOf, resLabel,

root.BL = BL; if (typeof module !== 'undefined') module.exports = BL;
})(typeof window !== 'undefined' ? window : globalThis);

  renderTop();renderDock();
  if(!first&&firstNew){const y=firstNew.getBoundingClientRect().top+window.scrollY-($('#top').offsetHeight+10);window.scrollTo({top:y,behavior:'smooth'});}
  else if(first){requestAnimationFrame(()=>window.scrollTo(0,document.body.scrollHeight));}
  document.body.style.paddingBottom=($('#dock').offsetHeight+10)+'px';
}
function renderTop(){
  const inf=BL.tInfo(G.t);
  $('#tAge').textContent=BL.age(G)+'歲';$('#tYear').textContent=inf.year+'·'+inf.season;
  $('#tOv').textContent=BL.overall(G);$('#tMerit').textContent=G.merit;
  const seasons=['秋','冬','春','夏'],cur=G.t%4;
  $('#pips').innerHTML=seasons.map((s,i)=>`<div class="pip ${i<cur?'on':''} ${i===cur?'cur':''}"></div>`).join('')+`<span>${esc(BL.rankName(G))}${G.married?'｜已婚':''}</span>`;
}

/* ---------- 決策面板 ---------- */
function actChoose(c){
  try{
    const ok=BL.choose(G,c);
    if(!ok){toast('這個選擇目前無法成立');return;}
  }catch(e){console.error(e);toast('發生錯誤：'+e.message);return;}
  saveNow();
  draft=null;dockMin=false;sync(false);
}
function pvHTML(ev){return `<div class="pv"><span>難度 ${ev.diff}</span><span>有效值 ${ev.eff}</span><span class="r-${ev.key}">預估：${esc(BL.resLabel(ev))}</span></div>`;}
function renderDock(){
  const n=G.node,d=$('#dBody'),t=$('#dTitle');
  $('#dock').classList.toggle('min',dockMin);$('#dToggle').textContent=dockMin?'展開 ▴':'收合 ▾';
  if(!n){t.textContent='';d.innerHTML='';return;}
  if(n.kind==='end'){t.textContent='人生終章';d.innerHTML='<p class="hint">這段人生已經寫完。你可以回到結算報告，或換個種子再活一次。</p><div class="row"><button class="btn pri" data-act="again">換個劇本再活一次</button><button class="btn" data-act="copyshare">複製分享文字</button></div>';return;}
  t.textContent=n.title||'決策';
  let h=n.hint?`<p class="hint">${esc(n.hint)}</p>`:'';
  if(n.kind==='team')h+=teamHTML(n);
  else if(n.kind==='plans')h+=plansHTML(n);
  else if(n.kind==='tragic')h+=`<p>代價：<b>${esc(n.cost)}</b></p><div class="opts"><button class="opt" data-c="y"><div class="on">承擔代價，轉為悲壯成功</div><div class="ol">${esc(n.cost)}</div></button><button class="opt" data-c="n"><div class="on">接受失敗</div><div class="ol">不付代價，承受失敗後果</div></button></div>`;
  else if(n.kind==='pick')h+=pickHTML(n);
  d.innerHTML=h;
}
function teamHTML(n){
  draft=draft||{inv:[]};
  const cards=n.cands.map(x=>{const c=x.c,ev=x.ev,on=draft.inv.includes(c.id);
    return `<label class="opt cand"><input type="checkbox" data-inv="${c.id}" ${on?'checked':''}><div><div class="on">${esc(c.name)}　<span class="tag">${c.origin==='noble'?'貴族':c.origin==='border'?'邊境':'平民'}</span><span class="tag">${esc(c.role)}</span><span class="tag">${esc(c.trait)}</span></div>
    <div class="ol">能力評級 ${c.rating}｜長處：${esc(c.str)}｜短處：${esc(c.weak)}</div>${pvHTML(ev).replace('預估：','答應機率判定：')}</div></label>`;}).join('');
  return `<div class="opts">${cards}</div><div class="row stick"><button class="btn pri" id="invGo" ${draft.inv.length?'':'disabled'}>邀請所選（${draft.inv.length}/3）</button><button class="btn" data-c="t:solo">孤狼出戰</button></div>`;
}
function plansHTML(n){
  const opts=n.opts.map(o=>`<button class="opt" data-c="p:${o.id}" ${o.disabled?'disabled':''}><div class="on"><span class="tag">${({conserv:'穩健',iron:'強攻',trick:'巧計'})[o.kind]||'方案'}</span>${esc(o.name)}</div><div class="ol">${esc(o.line)}</div>${o.disabled?`<div class="ol">⛔ ${esc(o.disabled)}</div>`:pvHTML(o.prev)}</button>`).join('');
  let free='';
  if(n.free){
    if(!draft||!draft.sel){draft={sel:{},open:false};for(const g of n.free.groups){const f=g.choices.find(c=>!c.disabled);if(f)draft.sel[g.id]=f.id;}draft.custom=n.free.custom?(BL.PRESETS.B.mods.slice()):null;}
    free=`<button class="opt" id="freeTog" style="margin-top:8px;border-style:dashed"><div class="on">✎ 自由組合</div><div class="ol">自己拼出行動路線、借力與裝備，下方即時預估</div></button>`;
    if(draft.open){
      free+=`<div class="free">${freeBody(n)}</div>`;
    }
  }
  return `<div class="opts">${opts}</div>${free}`;
}
function freeBody(n){
  const f=n.free,sel=draft.sel;let h='';
  for(const g of f.groups){
    h+=`<h4>${esc(g.label)}</h4><div class="chips">${g.choices.map(c=>`<button data-g="${g.id}" data-v="${c.id}" class="${sel[g.id]===c.id?'on':''}" ${c.disabled?'disabled':''} title="${esc(c.desc||'')}">${esc(c.label)}</button>`).join('')}</div>`;
    const cur=g.choices.find(c=>c.id===sel[g.id]);
    if(cur)h+=`<div class="ol mute" style="font-size:.82em;margin-top:3px">${esc(cur.disabled?'⛔ '+cur.disabled:cur.desc||'')}</div>`;
  }
  let invalid='';
  if(f.custom&&sel.loadout==='custom'){
    const cap=f.custom.cap,used=BL.slotsUsed(draft.custom);
    h+=`<h4>自訂模組（槽位 ${used}/${cap}）</h4><div class="chips">${f.custom.mods.map(m=>{const M=BL.MODS[m];return `<button data-m="${m}" class="${draft.custom.includes(m)?'on':''}" ${M.req?'disabled':''}>${esc(M.n)}（${M.s}）</button>`}).join('')}</div>`;
    if(used>cap)invalid=`槽位超出上限 ${used}/${cap}`;
    if(!draft.custom.includes('rifle'))invalid='必須配備步槍';
  }
  let pv='';
  if(invalid)pv=`<p style="color:var(--bad)">⚠ ${invalid}</p>`;
  else{try{const s=freeSel();const r=BL.previewFree(G,s);pv=`<div style="margin-top:8px"><b>${esc(r.o.name||'自由組合')}</b>${pvHTML(r.ev)}</div>`;}catch(e){pv=`<p class="mute">（此組合尚無法預估）</p>`;}}
  return h+pv+`<div class="row stick"><button class="btn pri" id="freeGo" ${invalid?'disabled':''}>執行這個組合</button></div>`;
}
function freeSel(){const s=Object.assign({},draft.sel);if(s.loadout==='custom')s.custom=draft.custom.slice();return s;}
function pickHTML(n){
  draft=draft&&draft.pk!==undefined?draft:{pk:null};
  return `<div class="opts">${n.opts.map((o,i)=>{
    const armed=draft.pk===i;
    return `<button class="opt" data-pk="${i}" ${o.disabled?'disabled':''} style="${armed?'border-color:var(--accent)':''}"><div class="on">${esc(o.name)}</div><div class="ol">${esc(o.line||'')}</div>${o.desc?`<div class="ol" style="margin-top:.2em">${esc(o.desc)}</div>`:''}${o.disabled?`<div class="ol">⛔ ${esc(o.disabled)}</div>`:''}${armed?'<div class="on" style="color:var(--accent);margin-top:.3em">再點一次確認這個選擇</div>':''}</button>`}).join('')}</div>`;
}
$('#dBody').addEventListener('click',e=>{
  const n=G&&G.node;if(!n)return;
  let t=e.target.closest('[data-act]');if(t){act(t.dataset.act);return;}
  t=e.target.closest('[data-c]');if(t){actChoose(t.dataset.c);return;}
  if(e.target.closest('#invGo')){actChoose('t:'+draft.inv.join(','));return;}
  if(e.target.closest('#freeTog')){draft.open=!draft.open;renderDock();return;}
  if(e.target.closest('#freeGo')){actChoose('f:'+JSON.stringify(freeSel()));return;}
  t=e.target.closest('[data-g]');if(t&&!t.disabled){draft.sel[t.dataset.g]=t.dataset.v;renderDock();return;}
  t=e.target.closest('[data-m]');if(t&&!t.disabled){const m=t.dataset.m,a=draft.custom,i=a.indexOf(m);if(i>=0)a.splice(i,1);else a.push(m);renderDock();return;}
  t=e.target.closest('[data-pk]');if(t&&!t.disabled){const i=+t.dataset.pk,o=n.opts[i];
    if(o.confirm&&draft.pk!==i){draft.pk=i;renderDock();return;}
    actChoose('k:'+i);return;}
});
$('#dBody').addEventListener('change',e=>{
  const c=e.target.closest('[data-inv]');if(!c)return;const id=+c.dataset.inv,a=draft.inv,i=a.indexOf(id);
  if(c.checked){if(a.length>=3){c.checked=false;toast('最多邀請 3 人');return;}a.push(id);}else if(i>=0)a.splice(i,1);
  renderDock();
});
$('#dToggle').onclick=()=>{dockMin=!dockMin;renderDock();document.body.style.paddingBottom=($('#dock').offsetHeight+10)+'px';};
$('#feed').addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t)act(t.dataset.act);});

function shareText(){
  const f=G.feed.find(x=>x.k==='report');
  if(!f)return '邊境人生模擬器';
  return `邊境人生模擬器《${f.script}》\n${f.name} 享年${f.age}・${f.rank}\n結局：${f.ending?f.ending.n:'—'}｜評價 ${f.grade.rank}「${f.grade.name}」（${f.grade.pts}分）\n戰功${f.merit}${f.married?'｜已成婚':''}｜子女${f.children.length}人\n四個劇本、十五種結局，你能解鎖幾個？`;
}
function act(a){
  if(a==='copyshare')copy(shareText());
  if(a==='again'){store.del('bl_save');backToStart();}
}

/* ---------- 抽屜 ---------- */
function openDrawer(html){$('#dSh').innerHTML=html;$('#drawer').classList.add('open');}
$('#dBk').onclick=()=>$('#drawer').classList.remove('open');
$('#dSh').addEventListener('click',e=>{const t=e.target.closest('[data-x]');if(!t)return;
  const x=t.dataset.x;if(x==='close')$('#drawer').classList.remove('open');
  if(x==='restart'){store.del('bl_save');$('#drawer').classList.remove('open');begin(sid,newSeed(),[]);}
  if(x==='ends'){$('#dSh').innerHTML=endingsHTML();}
  if(x==='home'){$('#drawer').classList.remove('open');backToStart();}
});
const bar=(l,v,max)=>`<div class="bar"><span>${esc(l)}</span><i><u style="width:${Math.max(0,Math.min(100,v/max*100))}%"></u></i><b>${v}</b></div>`;
$('#bDetail').onclick=()=>{
  const s=G.stats,N=BL.ATTR_N,fam=G.family||{};
  const REL=['尚未結識','初識','分隔兩地','重逢','','已成婚'];
  let h=`<h2>詳情<button class="btn sm" data-x="close">關閉</button></h2>
  <div class="sec">五維</div><div class="bars">${['pro','body','pol','fam','rep'].map(k=>bar(N[k],s[k],12)).join('')}</div>
  <div class="sec">關係</div><div class="bars">${bar('好感',G.aff,100)}${bar('信任',G.trust,100)}${bar('米切爾',G.mitch.bond,100)}</div>
  <p class="mute" style="margin:.4em 0 0">薇若妮卡：${REL[G.rel]||'—'}${G.ruzhui?'｜入贅':''}${G.debt?'｜人情債×'+G.debt:''}｜米切爾：${({ok:'健在',injured:'負傷',retired:'退役',dead:'已殉職'})[G.mitch.status]||esc(G.mitch.status)}</p>
  <div class="sec">家人</div><p style="margin:0">父親 ${esc(fam.father&&fam.father.name)}${fam.father&&fam.father.alive===false?'（已逝）':''}　母親 ${esc(fam.mother&&fam.mother.name)}${fam.mother&&fam.mother.alive===false?'（已逝）':''}<br>妹妹 ${esc(fam.sister&&fam.sister.name)}（${esc(fam.sister&&fam.sister.trait)}）${G.children.length?'<br>子女：'+G.children.map(c=>esc(c.given)).join('、'):''}${G.mentee?'<br>徒弟：'+esc(G.mentee.name)+'（'+esc(G.mentee.trait)+'）':''}</p>
  <div class="sec">傷病檔案</div>${G.injuries.length?'<ul style="margin:0;padding-left:1.1em">'+G.injuries.map(i=>`<li><b>${esc(i.name)}</b>（${i.age}歲）<span class="mute"> ${esc(i.desc)}</span></li>`).join('')+'</ul>':'<p class="mute" style="margin:0">無</p>'}
  <div class="sec">裝備</div><p style="margin:0 0 .4em">${esc(BL.TIER_N[G.tier])}｜${esc(BL.loadoutName(G.loadout))}｜槽位 ${BL.slotsUsed(G.loadout)}/${BL.SLOT_CAP[G.tier]}</p>
  <div class="mods">${G.loadout.map(m=>`<span class="chip">${esc(BL.MODS[m].n)}</span>`).join('')}</div>
  <p class="mute" style="margin:.4em 0 0">彈藥餘量：榴彈 ${G.ammo.gren}　破片 ${G.ammo.frag}　煙幕 ${G.ammo.smoke}</p>
  ${G.allies&&G.allies.length?`<div class="sec">戰友</div><p style="margin:0">${G.allies.map(a=>esc(a.name||(a.c&&a.c.name)||a)).join('、')}</p>`:''}
  <div class="sec">人生紀錄</div>${G.life.length?'<ul style="margin:0;padding-left:1.1em">'+G.life.map(l=>`<li>${l.age}歲　${esc(l.text)}</li>`).join('')+'</ul>':'<p class="mute" style="margin:0">尚無</p>'}`;
  openDrawer(h);
};
$('#bTrait').onclick=()=>{
  const TN={dukeBound:'與公爵家有牽連',free:'保留獨立姓名',mitchReady:'米切爾可並肩作戰',recommended:'獲得推薦',reserve:'備取入學',
    suspect:'被列為嫌疑對象',cleared:'嫌疑已洗清',scarred:'被「保留觀察」',proto:'私藏原型模組',protoKnown:'知道原型模組的下落',protoProven:'原型模組實戰驗證',protoPilot:'原型機試驗者',

    warHero:'配給站英雄',rescuedKid:'救下過少年',insubordination:'違令救援記錄',mole:'灰鴉的線人',moleCoup:'策反成功',moleTurned:'向軍部交出過線',moleRefused:'拒絕過叛軍',moleToldV:'向她坦白過',lone:'孤身奮戰'};

  <div class="sec">天生</div><p style="margin:0"><b>寧願自己扛</b><br><span class="mute">遇到難處習慣獨自承擔，不輕易向人開口。這讓你耐壓，也讓親近的人最容易為你擔心。</span></p>
  <div class="sec">當前狀態</div><div class="mods">${tags.length?tags.map(k=>`<span class="chip">${esc(TN[k]||k)}</span>`).join(''):'<span class="mute">無</span>'}</div>
  ${G.carry.length?`<div class="sec">延續中的修正</div><ul style="margin:0;padding-left:1.1em">${G.carry.map(c=>`<li>${esc(c.why)}（${sg(c.v)}，剩 ${c.left} 次）</li>`).join('')}</ul>`:''}
  ${G.syn?`<div class="sec">隊伍默契</div><p style="margin:0">${sg(G.syn)}</p>`:''}
  ${G.children.length?`<div class="sec">子女特質</div><ul style="margin:0;padding-left:1.1em">${G.children.map(c=>`<li><b>${esc(c.given)}</b>：承父「${esc(c.ft)}」、承母「${esc(c.mt)}」，怪癖：${esc(c.ut)}</li>`).join('')}</ul>`:''}`;
  openDrawer(h);

$('#bMenu').onclick=()=>openDrawer(`<h2>選單<button class="btn sm" data-x="close">關閉</button></h2>
  <p>目前劇本：<b style="color:var(--accent)">《${esc(BL.SCRIPTS[sid].name)}》</b></p>
  <div class="row"><button class="btn" data-x="home">回到開始畫面</button><button class="btn" data-x="restart">重新開始這個劇本</button><button class="btn" data-x="ends">結局圖鑑</button></div>
  <p class="hint" style="margin-top:14px">進度會自動儲存在這個瀏覽器。每次開始人生，家人、同梯考生與對手都會重新生成，同一劇本也會走出不同的人生。</p>`);

})();
